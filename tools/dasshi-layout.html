<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>脱脂レイアウト図</title>
<!-- ネット不要（オフライン）で動く1ファイル。外部CDN・外部フォントは使わない -->
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; color:#f8fafc;
         font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif; background:#0b1020; }
  /* ===== ヘッダー ===== */
  header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 12px;
           background:linear-gradient(90deg,#6d28d9,#db2777 60%,#f59e0b); box-shadow:0 3px 12px rgba(0,0,0,.4); z-index:30; }
  header h1 { margin:0 6px 0 0; font-size:20px; letter-spacing:.5px; text-shadow:0 2px 0 rgba(0,0,0,.25); white-space:nowrap; }
  .ver { font-size:11px; font-weight:normal; opacity:.85; margin-left:6px; }
  .sp { flex:1; }
  .btn { border:0; border-radius:12px; padding:9px 13px; font-size:15px; font-weight:bold; cursor:pointer; color:#fff;
         background:rgba(255,255,255,.18); box-shadow:inset 0 -3px 0 rgba(0,0,0,.2); white-space:nowrap; font-family:inherit; }
  .btn:active { transform:translateY(2px); box-shadow:none; }
  .btn:disabled { opacity:.35; }
  .btn.edit-on { background:#facc15; color:#422006; }
  select.btn { appearance:none; padding-right:13px; }
  select.btn option { color:#111; }
  /* ===== 編集中バー（アンドン） ===== */
  #editBar { display:none; background:repeating-linear-gradient(45deg,#facc15 0 18px,#1f2937 18px 36px); padding:3px; z-index:25; }
  #editBar div { background:#facc15; color:#422006; font-weight:bold; text-align:center; padding:4px; font-size:14px; border-radius:6px; }
  body.editing #editBar { display:block; }
  /* ===== 本体 ===== */
  .main { flex:1; display:flex; overflow:hidden; }
  aside { width:320px; background:#111827; border-right:1px solid #1f2937; overflow-y:auto; padding:10px; flex-shrink:0; }
  aside.hide { display:none; }
  .panel { background:#1f2937; border-radius:14px; padding:10px; margin-bottom:10px; }
  .panel h3 { margin:0 0 8px; font-size:14px; color:#f9a8d4; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .row input, .row select { flex:1; min-width:0; font-size:15px; padding:7px 8px; border-radius:8px; border:1px solid #374151;
                            background:#0b1020; color:#fff; font-family:inherit; }
  .mini { border:0; border-radius:8px; padding:7px 10px; font-size:14px; cursor:pointer; font-weight:bold; font-family:inherit; }
  .mini.add { background:#10b981; color:#fff; } .mini.del { background:#e11d48; color:#fff; } .mini.gray { background:#374151; color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:0; border-radius:10px; padding:6px 8px; font-size:12px; font-weight:bold; cursor:pointer; font-family:inherit;
          box-shadow:inset 0 -3px 0 rgba(0,0,0,.25); }
  .legend { display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; font-size:12px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .legend i { width:14px; height:14px; border-radius:4px; display:inline-block; flex-shrink:0; border:1px solid rgba(255,255,255,.3); }
  .note { font-size:12px; color:#cbd5e1; line-height:1.6; margin:0; padding-left:16px; }
  .hint { font-size:12px; color:#9ca3af; margin:4px 0 0; }
  .mface { width:30px; height:38px; flex-shrink:0; }
  .staff { border-bottom:1px solid #374151; padding-bottom:4px; margin-bottom:6px; }
  .mface .spark { display:none; }
  .trow { font-size:14px; color:#cbd5e1; gap:4px; padding-left:36px; }
  .row.trow select { flex:1 1 0; font-size:14px; padding:5px 4px; }
  #shipTxt { width:100%; font-size:14px; line-height:1.5; padding:8px; border-radius:8px; border:1px solid #374151;
             background:#0b1020; color:#fff; font-family:inherit; resize:vertical; }
  /* ===== マップ ===== */
  #view { flex:1; overflow:auto; position:relative; background:radial-gradient(circle at 30% 20%,#1e293b,#0b1020 70%); }
  #wrap { position:relative; margin:16px; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; border-radius:18px;
           background-color:#d6d9de; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  /* マス目は編集のときだけ表示 */
  body.editing #stage { background-color:#eef2f7;
           background-image:linear-gradient(to right,rgba(71,85,105,.35) 1px,transparent 1px),linear-gradient(to bottom,rgba(71,85,105,.35) 1px,transparent 1px);
           background-size:var(--g) var(--g); }
  /* ブロック（レゴ風：上にポッチ、下に厚み） */
  .blk { position:absolute; border-radius:9px; display:flex; align-items:center; justify-content:center; text-align:center;
         font-weight:900; line-height:1.15; overflow:hidden; padding:3px;
         box-shadow:inset 0 -6px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35), 0 2px 3px rgba(0,0,0,.25); }
  .blk::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.22;
                 background-image:radial-gradient(circle at 10px 10px, rgba(255,255,255,.9) 4px, rgba(0,0,0,.15) 5px, transparent 6px);
                 background-size:20px 20px; }
  .blk .lb { position:relative; white-space:pre-line; word-break:break-all; }
  .blk.v .lb { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:-1px; }
  .blk .wd { position:absolute; left:3px; bottom:6px; font-size:10px; background:rgba(255,255,255,.85); color:#111;
             border-radius:5px; padding:0 4px; font-weight:bold; }
  .blk.flat { box-shadow:none; border-radius:2px; } .blk.flat::before { display:none; }
  /* 歩行帯：緑＋白い破線 */
  .blk.walk { background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 10px,transparent 10px 20px) !important; }
  .blk.pillar { border-radius:3px; box-shadow:0 2px 3px rgba(0,0,0,.5); } .blk.pillar::before { display:none; }
  /* 脱脂ライン（動くコンベア＋泡） */
  .blk.line { box-shadow:inset 0 0 0 4px #60a5fa, 0 3px 10px rgba(0,0,0,.35); }
  .blk.line::before { opacity:.25; background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 14px,transparent 14px 40px);
                      background-size:40px 100%; animation:belt 1.6s linear infinite; }
  @keyframes belt { to { background-position:40px 0; } }
  .blk.line .lb { font-size:46px; opacity:.35; letter-spacing:4px; }
  .bub { position:absolute; bottom:-14px; border-radius:50%; background:rgba(255,255,255,.55); animation:rise linear infinite; pointer-events:none; }
  @keyframes rise { to { transform:translateY(-420px); opacity:0; } }
  /* 編集モード */
  body.editing .blk { cursor:grab; outline:1px dashed rgba(0,0,0,.25); touch-action:none; }
  body.editing .blk.sel { outline:4px solid #facc15; z-index:50; }
  .x, .rz { display:none; position:absolute; z-index:60; }
  body.editing .blk.sel .x { display:flex; right:2px; top:2px; width:36px; height:36px; border-radius:50%; background:#e11d48; color:#fff;
       font-size:22px; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 4px rgba(0,0,0,.4); }
  body.editing .blk.sel .rz { display:block; right:0; bottom:0; width:40px; height:40px; cursor:nwse-resize;
       background:linear-gradient(135deg,transparent 50%,#facc15 50%); border-bottom-right-radius:8px; }
  /* マスコット */
  .ms { position:absolute; width:58px; height:75px; z-index:40; cursor:pointer; transition:filter .2s; }
  .ms svg { width:100%; height:100%; overflow:visible; }
  .ms.left svg { transform:scaleX(-1); }
  .ms.walk .legL { animation:legA .35s infinite alternate; transform-origin:16px 38px; }
  .ms.walk .legR { animation:legA .35s infinite alternate-reverse; transform-origin:24px 38px; }
  @keyframes legA { from { transform:rotate(-18deg); } to { transform:rotate(18deg); } }
  .ms.walk .bodyG { animation:bob .35s infinite alternate; }
  @keyframes bob { to { transform:translateY(-1.5px); } }
  .ms.work .arm { animation:hammer .3s infinite alternate; transform-origin:28px 29px; }
  @keyframes hammer { from { transform:rotate(-40deg); } to { transform:rotate(25deg); } }
  .ms .spark { display:none; position:absolute; right:-12px; top:-6px; font-size:20px; animation:twk .5s infinite alternate; }
  .ms.work .spark { display:block; }
  @keyframes twk { from { transform:scale(.6) rotate(0); opacity:.5; } to { transform:scale(1.1) rotate(20deg); opacity:1; } }
  .ms.hop { animation:hop .5s; }
  @keyframes hop { 40% { transform:translateY(-22px); } }
  body.editing .ms { opacity:.35; pointer-events:none; }
  /* 出勤・退勤の演出（交代の見える化）：上からぴょんと出る／手をふって小さくなって消える */
  .ms.dIn { animation:msIn .9s ease-out; }
  @keyframes msIn { 0% { transform:translateY(-46px) scale(.2); opacity:0; } 55% { transform:translateY(4px) scale(1.18); opacity:1; }
                    75% { transform:translateY(-6px) scale(.95); } 100% { transform:none; } }
  .ms.dOut { animation:msOut 1.6s ease-in forwards; }
  @keyframes msOut { 0%,15% { transform:none; } 25% { transform:translateY(-14px); } 35% { transform:none; } 45% { transform:translateY(-14px); }
                     55% { transform:none; opacity:1; } 100% { transform:translateY(-30px) scale(.1); opacity:0; } }
  .ms .fx { position:absolute; left:50%; top:-26px; transform:translateX(-50%); font-size:24px; pointer-events:none;
            animation:fxUp 1.6s ease-out forwards; }
  @keyframes fxUp { 0% { opacity:0; transform:translate(-50%,10px) scale(.5); } 20% { opacity:1; transform:translate(-50%,0) scale(1.2); }
                    80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-24px) scale(1); } }
  /* リフトのマスコット（何も置いていない床＝リフト走行エリアを走る） */
  .ms.lift { width:70px; height:52px; }
  .ms.lift .wh { transform-box:fill-box; transform-origin:center; }
  .ms.lift.walk .wh { animation:spinW .5s linear infinite; }
  @keyframes spinW { to { transform:rotate(360deg); } }
  .ms.lift .pat { animation:blink .5s infinite alternate; }
  @keyframes blink { from { opacity:.3; } to { opacity:1; } }
  .ms.lift.work .fork { animation:forkUp 1.4s ease-in-out infinite alternate; }
  @keyframes forkUp { from { transform:translateY(0); } to { transform:translateY(-12px); } }
  .ms.lift .spark { display:none !important; }
  .ms.lift .name { bottom:56px; }
  /* 持っている荷物（緑＝素材、銀＝完成品） */
  .carry { display:none; position:absolute; left:50%; top:-6px; width:16px; height:12px; transform:translateX(-50%); border-radius:3px;
           border:1px solid rgba(0,0,0,.45); box-shadow:0 1px 2px rgba(0,0,0,.4); pointer-events:none; }
  .ms.carry-mat .carry { display:block; background:#92d050; }
  .ms.carry-fin .carry { display:block; background:linear-gradient(135deg,#ffffff,#94a3b8); }
  .ms.lift .carry { left:80%; top:10px; width:18px; height:14px; }
  .mface .carry { display:none !important; }
  /* 周回コンベア（脱脂ラインの中） */
  .cvLayer { position:absolute; inset:0; z-index:3; pointer-events:none; }
  .cvLayer svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .cvLayer .rail { fill:none; stroke:#93c5fd; stroke-width:10; stroke-linejoin:round; opacity:.9; }
  .cvLayer .rail2 { fill:none; stroke:#1e3a8a; stroke-width:2; stroke-dasharray:8 10; animation:railGo 1s linear infinite; }
  @keyframes railGo { to { stroke-dashoffset:-18; } }
  .cvLayer .tag { position:absolute; transform:translate(-50%,-50%); font-size:11px; font-weight:bold; color:#fff; background:#1e3a8a;
                  border:2px solid #93c5fd; border-radius:8px; padding:0 5px; white-space:nowrap; }
  .hg { position:absolute; left:0; top:0; width:14px; height:22px; margin:-3px 0 0 -7px; }
  .hg::before { content:""; position:absolute; left:6px; top:0; width:2px; height:9px; background:#cbd5e1; }
  .hg i { display:none; position:absolute; left:0; top:8px; width:14px; height:12px; border-radius:2px; border:1px solid rgba(0,0,0,.4); }
  .hg.raw i { display:block; background:#92d050; }
  .hg.done i { display:block; background:linear-gradient(135deg,#ffffff,#94a3b8); box-shadow:0 0 6px #fff; }
  /* 個数（投入バッファ・完成品置き・山積み）と、異常のアンドン */
  .cnt { position:absolute; z-index:30; pointer-events:none; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding:2px; }
  .cnt .stack { display:flex; flex-wrap:wrap-reverse; justify-content:center; gap:1px; max-width:100%; }
  .cnt i { display:block; width:10px; height:7px; border-radius:2px; border:1px solid rgba(0,0,0,.35); }
  .cnt i.mat { background:#92d050; } .cnt i.fin { background:linear-gradient(135deg,#ffffff,#94a3b8); }
  .cnt.pile .stack { flex-direction:column-reverse; flex-wrap:nowrap; } .cnt.pile i { width:22px; height:8px; }
  .cnt b { font-size:11px; background:rgba(17,24,39,.85); color:#fff; border-radius:6px; padding:0 4px; white-space:nowrap; margin-top:1px; }
  .cnt.warn b { background:#e11d48; animation:blink .5s infinite alternate; }
  .cnt.call b { background:#f59e0b; color:#111; }
  .row select.role { flex:0 0 78px; font-size:13px; padding:6px 3px; }
  .name { position:absolute; left:50%; bottom:80px; transform:translateX(-50%); white-space:nowrap; pointer-events:none;
          background:#fff; color:#be185d; border:3px solid #ec4899; border-radius:14px; padding:3px 10px; font-size:16px; font-weight:900;
          box-shadow:0 3px 0 #9d174d; animation:pop 2.2s forwards; }
  .name::after { content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%); border:6px solid transparent; border-top-color:#ec4899; }
  @keyframes pop { 0% { opacity:0; transform:translateX(-50%) scale(.4); } 12% { opacity:1; transform:translateX(-50%) scale(1.1); }
                   20% { transform:translateX(-50%) scale(1); } 85% { opacity:1; } 100% { opacity:0; } }
  /* トースト */
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; border:2px solid #f472b6;
           padding:10px 18px; border-radius:14px; font-weight:bold; font-size:16px; display:none; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,.5);
           white-space:pre-line; text-align:center; text-wrap:balance; max-width:92vw; }
  /* 作業手順メニュー（4つの工程） */
  #tjMenu { display:none; position:fixed; z-index:60; background:#1f2937; border:3px solid #f472b6; border-radius:16px; padding:10px;
            grid-template-columns:1fr 1fr; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.6); }
  #tjMenu.show { display:grid; }
  #tjMenu a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:110px; min-height:84px;
              padding:10px; border-radius:14px; color:#fff; font-weight:bold; font-size:16px; text-decoration:none; text-align:center;
              box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
  #tjMenu a b { font-size:30px; line-height:1; }
  #tjMenu a:active { transform:translateY(2px); box-shadow:none; }
  /* スマホ（せまい画面）：ボタンを小さく。たて画面はマップが上・パネルが下（☰でパネルを消すとマップが全体に広がる）
     よこ画面はパネルを左に、少しせまくして出す */
  @media (max-height:500px) { aside { width:260px; } }
  @media (max-width:760px) {
    header { padding:5px 6px; gap:4px; }
    header h1 { font-size:14px; margin-right:0; }
    .ver { font-size:9px; margin-left:3px; }
    .btn { padding:6px 7px; font-size:12px; border-radius:9px; }
    .sp { display:none; }
    #editBar div { font-size:12px; }
  }
  @media (max-width:760px) and (orientation:portrait) {
    .main { flex-direction:column; }
    #view { order:1; flex:0 0 42%; min-height:0; }
    aside { order:2; width:auto; flex:1 1 auto; min-height:0; border-right:0; border-top:3px solid #db2777; }
    aside.hide + #view { flex:1 1 auto; }
    #wrap { margin:8px; }
  }
  /* 印刷：レイアウト図だけを出す */
  @media print {
    header, aside, #editBar, #toast, #tjMenu, .ms, .cnt, .hg, .cvLayer .tag { display:none !important; }
    body, #view { background:#fff; overflow:visible; height:auto; }
    #stage { box-shadow:none; }
  }
</style>
</head>
<body>
<header>
  <h1>🧱 <span id="t-title"></span><span class="ver">ver 2026-11-28</span></h1>
  <button class="btn" onclick="toggleSide()">☰</button>
  <button class="btn" id="bEdit" onclick="toggleEdit()"></button>
  <button class="btn" id="bUndo" onclick="undo()" disabled>↩ <span id="t-undo"></span></button>
  <button class="btn" id="bXout" onclick="exportXlsx()"></button>
  <button class="btn" id="bXin" onclick="$('impX').click()" style="display:none"></button>
  <input type="file" id="impX" accept=".xlsx" style="display:none" onchange="importXlsx(this)">
  <span class="sp"></span>
  <button class="btn" id="bTj" onclick="toggleTj(event)"></button>
  <button class="btn" onclick="zoom(1/1.2)">－</button>
  <button class="btn" onclick="fit()" id="bFit"></button>
  <button class="btn" onclick="zoom(1.2)">＋</button>
  <select class="btn" id="lang" onchange="setLang(this.value)">
    <option value="ja">🇯🇵 日本語</option>
    <option value="id">🇮🇩 Indonesia</option>
    <option value="tl">🇵🇭 Tagalog</option>
    <option value="en">🇺🇸 English</option>
  </select>
</header>
<div id="editBar"><div id="t-editing"></div></div>

<div class="main">
  <aside id="side">
    <!-- 編集モードのときだけ出る：選んだブロックの変更 -->
    <div class="panel" id="pSel" style="display:none">
      <h3 id="t-selT"></h3>
      <div class="row"><input id="sLabel" oninput="editSel('label',this.value)"></div>
      <div class="row"><select id="sCat" onchange="editSel('cat',this.value)"></select>
        <select id="sWd" onchange="editSel('wd',this.value)" style="flex:0 0 70px">
          <option value="">-</option><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
      <div class="row"><button class="mini gray" onclick="dupSel()" id="t-dup"></button>
        <button class="mini del" onclick="delSel()" id="t-del"></button></div>
    </div>
    <div class="panel" id="pAdd" style="display:none">
      <h3 id="t-addT"></h3>
      <div class="chips" id="addChips"></div>
      <p class="hint" id="t-addH"></p>
    </div>
    <div class="panel" id="pTools" style="display:none">
      <h3 id="t-toolT"></h3>
      <div class="row"><button class="mini gray" onclick="exportFile()" id="t-exp"></button>
        <button class="mini gray" onclick="document.getElementById('imp').click()" id="t-imp"></button></div>
      <div class="row"><button class="mini gray" onclick="window.print()" id="t-print"></button>
        <button class="mini del" onclick="resetAll()" id="t-reset"></button></div>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importFile(this)">
      <p class="hint" id="t-toolH"></p>
    </div>
    <!-- いつでも出る -->
    <div class="panel">
      <h3 id="t-msT"></h3>
      <div id="msList"></div>
      <button class="mini add" onclick="addMascot('man')" id="t-msAdd"></button>
      <!-- 編集モードのときだけ：役割の名前を変える（言語ごと。空にすると最初の名前） -->
      <div id="roleEd" style="display:none; margin-top:8px">
        <p class="hint" id="t-roleEdT"></p>
        <div class="row"><input data-nk="roleIn" maxlength="10" oninput="editName(this)"><input data-nk="roleOut" maxlength="10" oninput="editName(this)"><input data-nk="rolePat" maxlength="10" oninput="editName(this)"></div>
      </div>
      <p class="hint" id="t-msH"></p>
    </div>
    <div class="panel">
      <h3 id="t-pkT"></h3>
      <div id="pkList"></div>
      <button class="mini add" onclick="addMascot('pick')" id="t-pkAdd"></button>
      <p class="hint" id="t-pkH"></p>
    </div>
    <div class="panel">
      <h3 id="t-lfT"></h3>
      <div id="lfList"></div>
      <button class="mini add" onclick="addMascot('lift')" id="t-lfAdd"></button>
      <p class="hint" id="t-lfH"></p>
    </div>
    <div class="panel">
      <h3 id="t-lgT"></h3>
      <div class="legend" id="legend"></div>
      <p class="hint" style="margin-top:8px">A=130cm　B=120cm　C=170cm<br><span id="t-tape"></span></p>
    </div>
    <div class="panel">
      <h3 id="t-shipT"></h3>
      <ul class="note" id="shipNote"></ul>
      <!-- 編集モードのときだけ：出荷時間の文を直す（言語ごと） -->
      <div id="shipEd" style="display:none">
        <p class="hint" id="t-shipTitleH" style="margin:0 0 4px"></p>
        <div class="row"><input data-nk="shipT" maxlength="20" oninput="editName(this)"></div>
        <textarea id="shipTxt" rows="9" oninput="editShip(this.value)"></textarea>
        <p class="hint" id="t-shipEdH"></p>
        <button class="mini gray" onclick="resetShip()" id="t-shipReset"></button>
      </div>
    </div>
  </aside>
  <div id="view"><div id="wrap"><div id="stage"></div></div></div>

/* 前の版で保存したデータに、版を上げたとき足したものだけを入れる（現場が直した配置は消さない） */
function migrate() {
  if (!S.rev) {        // rev 3：歩行帯2本
    DEFAULT_LAYOUT.filter(a => a[0] === 'aisle' && a[2] === 572).forEach(a => {
      const x = g(a[2]), y = g(a[3]);

    });

  }
  if (S.rev < 4) {     // rev 4：出荷エリア → 集荷エリア、集荷スタッフ
    S.blocks.forEach(b => { if (b.cat === 'shipArea' && b.label === '出荷エリア') b.label = '集荷エリア'; });
    if (!S.mascots.some(m => m.kind === 'pick')) S.mascots.push(...mkPickers());
    S.rev = 4;
  }
  if (S.rev < 5) {     // rev 5：投入バッファ・完成品置き、スタッフの役割、リフトは1台
    DEFAULT_LAYOUT.filter(a => ['inBuf','outBuf'].includes(a[0]) && !S.blocks.some(b => b.cat === a[0])).forEach(a => {
      const x = g(a[2]), y = g(a[3]);
      S.blocks.push({id:uid++, cat:a[0], label:a[1], x, y, w:g(a[2]+a[4]) - x, h:g(a[3]+a[5]) - y, wd:''});

    S.mascots = S.mascots.filter(m => !(m.kind === 'lift' && ['リフト2号','リフト3号'].includes(m.name)));   // 名前を変えていない2号・3号だけ消す
    S.rev = 5;
  }
  if (S.rev < 6) {     // rev 6：投入バッファ・完成品置きを新しい場所へ（前の初期位置のままのときだけ）
    const mv = (cat, ox, oy, a) => { const b = S.blocks.find(b => b.cat === cat && b.x === ox && b.y === oy && b.w === 72 - (cat === 'outBuf' ? 18 : 0));
      if (b) { b.x = g(a[2]); b.y = g(a[3]); b.w = g(a[2] + a[4]) - b.x; b.h = g(a[3] + a[5]) - b.y; } };
    mv('inBuf', 882, 522, DEFAULT_LAYOUT.find(a => a[0] === 'inBuf'));
    mv('outBuf', 828, 738, DEFAULT_LAYOUT.find(a => a[0] === 'outBuf'));
    S.rev = 6;
  }
}

/* ===== 元に戻す（削除・移動のやり直し＝失敗しても大丈夫） ===== */
function pushUndo() { undoStack.push(JSON.stringify(S.blocks)); if (undoStack.length > 30) undoStack.shift(); $('bUndo').disabled = false; }
function undo() { if (!undoStack.length) return; S.blocks = JSON.parse(undoStack.pop()); $('bUndo').disabled = !undoStack.length; save(); renderBlocks(); }

/* ===== マップ描画 ===== */
function stageSize() {
  let w = 400, h = 300;
  S.blocks.forEach(b => { w = Math.max(w, b.x + b.w); h = Math.max(h, b.y + b.h); });
  return {w: w + 20, h: h + 20};
}
function applyZoom() {
  const s = stageSize(), st = $('stage');
  st.style.width = s.w + 'px'; st.style.height = s.h + 'px'; st.style.setProperty('--g', G + 'px'); st.style.transform = `scale(${Z})`;
  $('wrap').style.width = s.w * Z + 'px'; $('wrap').style.height = s.h * Z + 'px';
}
function fit() { const v = $('view'), s = stageSize(); Z = Math.max(.2, Math.min((v.clientWidth - 32) / s.w, (v.clientHeight - 32) / s.h)); applyZoom(); }
function zoom(k) { Z = Math.max(.2, Math.min(3, Z * k)); applyZoom(); }

// 文字の大きさと向き：横書き・縦書きのうち、文字が大きく入る方を自動で選ぶ（Excel出力でも使う）
function textFit(b) {
  const lines = String(b.label || ' ').split('\n'), len = Math.max(...lines.map(l => l.length)) || 1;
  const fsH = Math.min((b.w - 8) / (len + .3), (b.h - 10) / (lines.length * 1.3));
  const fsV = Math.min((b.h - 10) / (len + .3), (b.w - 8) / (lines.length * 1.3));
  const vert = fsV > fsH * 1.15;
  return {vert, fs:Math.max(8, Math.min(20, vert ? fsV : fsH))};
}
function renderBlocks() {
  const st = $('stage');
  st.querySelectorAll('.blk').forEach(e => e.remove());
  S.blocks.forEach(b => {
    const c = catOf(b), el = document.createElement('div');
    const {vert, fs} = textFit(b);
    el.className = 'blk' + (b.id === selId ? ' sel' : '') + (b.cat === 'line' ? ' line' : '') +
                   (['wall','aisle'].includes(b.cat) ? ' flat' : '') + (b.cat === 'aisle' ? ' walk' : '') + (b.cat === 'pillar' ? ' pillar' : '') +
                   (vert ? ' v' : '');
    el.dataset.id = b.id;
    el.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;background:${c.bg};color:${c.fg};font-size:${fs}px`;
    el.innerHTML = `<span class="lb">${esc(b.label)}</span>${b.wd ? `<span class="wd">${esc(b.wd)}</span>` : ''}

      const s = 6 + Math.random() * 12, bu = document.createElement('span');

      el.appendChild(bu);

  });

}

/* ===== ドラッグ・サイズ変更・選択（マウスとタッチ両対応） ===== */
let act = null;
$('stage').addEventListener('pointerdown', e => {
  const el = e.target.closest('.blk');
  if (!el) { if (editing) { selId = null; renderBlocks(); } return; }
  const b = S.blocks.find(x => x.id == el.dataset.id);
  if (!editing) {                                     // ふだんはタップで名前を表示（小さい置き場も読める）
    if (b.label) toast(`${b.label.replace(/\n/g,'')}（${catOf(b)[lang]}）`);
    return;
  }
  if (e.target.classList.contains('x')) { delSel(); return; }
  e.preventDefault();
  if (selId !== b.id) { selId = b.id; renderBlocks(); }
  act = {b, mode: e.target.classList.contains('rz') ? 'rz' : 'mv', sx:e.clientX, sy:e.clientY,
         ox:b.x, oy:b.y, ow:b.w, oh:b.h, moved:false};
});
document.addEventListener('pointermove', e => {
  if (!act) return;
  const dx = (e.clientX - act.sx) / Z, dy = (e.clientY - act.sy) / Z;
  if (!act.moved && Math.abs(dx) + Math.abs(dy) < G / 2) return;
  if (!act.moved) { pushUndo(); act.moved = true; }
  const b = act.b, el = $('stage').querySelector(`.blk[data-id="${b.id}"]`);
  if (act.mode === 'mv') { b.x = Math.max(0, snap(act.ox + dx)); b.y = Math.max(0, snap(act.oy + dy)); }
  else { b.w = Math.max(G, snap(act.ow + dx)); b.h = Math.max(G, snap(act.oh + dy)); toast(`${b.w / G} × ${b.h / G} ${T().cells}`); }
  Object.assign(el.style, {left:b.x+'px', top:b.y+'px', width:b.w+'px', height:b.h+'px'});
});
document.addEventListener('pointerup', () => {
  if (!act) return;
  if (act.moved) { save(); renderBlocks(); }
  act = null;
});
