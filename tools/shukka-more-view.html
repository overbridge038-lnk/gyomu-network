<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>出荷漏れ照合（閲覧用）</title><style>
:root{--bg:#edf0f2;--sf:#fff;--sf2:#f6f8f9;--ink:#17212b;--mu:#5a6773;--ln:#d3d9de;--ok:#1f7a4d;--bad:#c0392b;--warn:#b7791f;--ac:#1d4e7a}
@media (prefers-color-scheme:dark){:root{--bg:#12171c;--sf:#1a2128;--sf2:#202830;--ink:#e4e9ee;--mu:#9aa7b3;--ln:#323d47;--ok:#3fae73;--bad:#e5655a;--warn:#d9a441;--ac:#6fa6d6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;font-size:15px}
main{max-width:1200px;margin:0 auto;padding:16px}h1{font-size:1.3rem;margin:0 0 4px}h1 small{font-size:.6em;color:var(--mu);font-weight:400}
.meta{color:var(--mu);font-size:.85rem}.band{border-radius:12px;padding:12px 16px;font-weight:700;color:#fff;margin:10px 0}.band.ok{background:var(--ok)}.band.ng{background:var(--bad)}.band.old{background:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.kpi b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}.kpi span{font-size:.8rem;color:var(--mu)}.kpi.red b{color:var(--bad)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:10px 0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{font:inherit;font-size:.85rem;min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--sf);border-color:var(--ink)}.fr span{display:inline-block;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sf2);border:1px solid var(--ln);margin:2px}
.fr span.stale{background:var(--warn);color:#fff}.fr span.lost{background:var(--bad);color:#fff}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:860px;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{font-size:.78rem;color:var(--mu);background:var(--sf2);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.sec td{background:color-mix(in srgb,var(--ac) 12%,var(--sf));font-weight:700;color:var(--ac)}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px}.none{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.part{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.over{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac)}
.rem{color:var(--bad);font-weight:700}.cm{white-space:normal;min-width:140px;font-weight:700;color:var(--warn)}.mono{font-family:Consolas,monospace}
details summary{cursor:pointer;font-weight:700}
tr.grp{cursor:pointer}tr.grp:hover td{background:var(--sf2)}tr.grp:focus-visible{outline:3px solid var(--ac);outline-offset:-3px}
.tg{display:inline-block;width:1.1em;color:var(--mu)}small.ol{color:var(--mu)}small.ol b{color:var(--ink)}
tr.det td{background:var(--sf2);font-size:.82rem;color:var(--mu);white-space:normal}tr.det.drem td{background:color-mix(in srgb,var(--bad) 8%,var(--sf2))}tr.det b{color:var(--ink)}.empty{text-align:center;color:var(--mu);padding:24px}#net b{color:var(--ink)}#net .x{color:var(--bad);font-weight:700}a.bk{color:var(--ac)}
</style></head><body><main>
<h1>出荷漏れ照合（閲覧用） <small>ver 2026-11-18b</small> <small id="ver"></small></h1><div class="meta" id="net"></div><div class="chips" id="dayF"></div><div class="meta">60秒ごとに最新の照合結果を読み直します。行をクリックすると、納入番号・オーダーごとの内訳が開きます。コメントの入力や照合は、照合しているPCで行ってください。</div>
<div id="band"></div><div class="kpis" id="kpis"></div>
<div class="box"><div class="meta">照合範囲</div><div id="scope"></div><div class="meta" style="margin-top:6px">端末ごとの最終読取（これより後の読取は、まだDriveに上がっていません）</div><div class="fr" id="fresh"></div></div>
<div class="chips" id="stF"></div><div class="chips" id="mkF"></div>
<div class="tw"><table><thead><tr><th>状態</th><th>背番号</th><th>品番</th><th>納入先</th><th class="n">かんばん枚数</th><th class="n">照合済</th><th class="n">残り</th><th>最終スキャン</th><th>コメント</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="box"><details><summary id="ngSum"></summary><div class="tw" style="margin-top:8px"><table><thead><tr><th>区分</th><th>種別</th><th>時刻</th><th>背番号</th><th>品番</th><th>番号</th><th>理由</th><th>ファイル</th></tr></thead><tbody id="ngTb"></tbody></table></div></details></div>
</main><script>
let D=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST={none:"未出荷",part:"途中",done:"完了",over:"過剰"};
const OPEN=new Set((()=>{try{return JSON.parse(localStorage.getItem("snapOpen")||"[]")}catch(e){return[]}})());
let st=(()=>{try{return localStorage.getItem("snapSt")||"rem"}catch(e){return"rem"}})(), mk=(()=>{try{return localStorage.getItem("snapMk")||"all"}catch(e){return"all"}})();
let DAY="", DAYS=[];
function dayMsg(m){ document.getElementById("dayF").innerHTML='<span class="meta">'+m+'</span>'; }
function drawDays(){
  const el=document.getElementById("dayF"); if(!DAYS.length){ el.innerHTML=""; return; }
  const wd=d=>"日月火水木金土"[new Date(d+"T00:00:00").getDay()];
  el.innerHTML='<button data-day=""'+(DAY?'':' class="on"')+'>今日（最新）</button>'+DAYS.map(d=>'<button data-day="'+d+'"'+(DAY===d?' class="on"':'')+'>'+d.slice(5).replace("-","/")+'（'+wd(d)+'）</button>').join("");
}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-day]"); if(!b) return; DAY=b.dataset.day; drawDays(); load();});
function draw(){
  if(!D) return;
  const age=Math.round((Date.now()-D.at)/60000);
  document.getElementById("ver").textContent=D.ver;
  document.getElementById("band").innerHTML = DAY
    ? '<div class="band old">📅 過去の状況：'+esc(DAY)+' の最後の照合（'+esc(D.atLabel)+'）　残り '+D.rem+'枚'+(D.ok?'・OK':'')+'</div>'
    : age>=90
    ? '<div class="band old">⚠ 最後の照合から'+age+'分たっています（'+esc(D.atLabel)+'）。照合しているPCの自動運転が止まっていないか確認してください。</div>'
    : '<div class="band '+(D.ok?"ok":"ng")+'">'+(D.ok?"✔ OK：すべて照合済み":"⚠ 要確認：残り "+D.rem+"枚")+'　（照合 '+esc(D.atLabel)+'・'+age+'分前）</div>';
  document.getElementById("kpis").innerHTML=[["かんばん枚数",D.tot,0],["残り",D.rem,D.rem],["過剰",D.over,D.over],["受注にないスキャン",D.unplanned,D.unplanned],["NG",D.ngs,D.ngs]]
    .map(([l,v,r])=>'<div class="kpi'+(r?" red":"")+'"><b>'+v+'</b><span>'+l+'</span></div>').join("");
  document.getElementById("scope").innerHTML=D.scope.map(esc).join("<br>")||"－";
  document.getElementById("fresh").innerHTML=D.fresh.map(x=>'<span class="'+(x.lost?"lost":x.stale?"stale":"")+'">'+esc(x.n)+'　'+esc(x.last)+'（'+x.mins+'分前）'+(x.lost?'　抜け'+x.lost+'件（通し'+esc(x.gaps)+'）':'')+'</span>').join("")||'<span>今日の読取はまだありません</span>';
  const cnt=k=>D.rows.filter(r=>k==="all"||(k==="rem"?r.rem>0:k==="cmt"?r.c:r.s===k)).length;
  document.getElementById("stF").innerHTML=[["rem","残りあり"],["all","すべて"],["none","未出荷"],["part","途中"],["done","完了"],["cmt","コメントあり"]]
    .map(([k,l])=>'<button class="'+(st===k?"on":"")+'" data-st="'+k+'">'+l+' '+cnt(k)+'</button>').join("");
  const makers=[...new Set(D.rows.map(r=>r.m))];
  document.getElementById("mkF").innerHTML=['<button class="'+(mk==="all"?"on":"")+'" data-mk="all">全メーカー</button>'].concat(makers.map(m=>'<button class="'+(mk===m?"on":"")+'" data-mk="'+esc(m)+'">'+esc(m)+'</button>')).join("");
  const v=D.rows.filter(r=>(mk==="all"||r.m===mk)&&(st==="all"||(st==="rem"?r.rem>0:st==="cmt"?r.c:r.s===st)));
  let h="",cur=null;
  for(const r of v){ const sec=r.m+"|"+r.d+"|"+r.b; if(sec!==cur){ cur=sec; const s=v.filter(x=>x.m+"|"+x.d+"|"+x.b===sec);
      h+='<tr class="sec"><td colspan="9">'+esc(r.m)+'　'+esc(r.dl)+(r.b?' 便'+esc(r.b):'')+'　残り '+s.reduce((a,x)=>a+x.rem,0)+'枚 ／ '+s.length+'品番</td></tr>'; }
    const isOpen=OPEN.has(r.k);
    h+='<tr class="grp'+(r.rem?' hasrem':'')+'" data-k="'+esc(r.k)+'" tabindex="0" aria-expanded="'+isOpen+'"><td><span class="tg">'+(isOpen?'▾':'▸')+'</span><span class="pill '+r.s+'">'+ST[r.s]+'</span></td><td class="mono">'+esc(r.sb)+(r.ky?'<br><small style="font-weight:700;color:var(--ac)">協豊 '+esc(r.ky)+'</small>':'')+'</td><td class="mono">'+esc(r.p)+'</td><td style="white-space:normal">'+esc(r.dest)+(r.ol.length?r.ol.map(o=>'<br><small class="ol">オーダー <b>'+esc(o[0])+'</b>　'+o[1]+'枚（済'+o[2]+'・残'+o[3]+'）</small>').join(''):'')+'</td><td class="n">'+r.plan+'</td><td class="n">'+r.done+'</td><td class="n '+(r.rem?"rem":"")+'">'+r.rem+'</td><td class="mono">'+esc(r.last||"—")+'</td><td class="cm">'+esc(r.c)+'</td></tr>';
    if(isOpen) for(const d of r.det) h+='<tr class="det'+(d.rem?' drem':'')+'"><td colspan="3">番号 <b class="mono">'+esc(d.doc||"-")+'</b>'+(d.ord?'　オーダー <b class="mono">'+esc(d.ord)+'</b>':'')+(d.uke?'　受入 '+esc(d.uke):'')+'　背番号 <b class="mono">'+esc(d.sb)+'</b></td><td style="white-space:normal">'+esc(d.dest)+(d.mr?'　メイン '+esc(d.mr):'')+'</td><td class="n">'+d.c+'</td><td class="n">'+d.g+'</td><td class="n'+(d.rem?' rem':'')+'">'+d.rem+'</td><td colspan="2" style="white-space:normal">収容数 '+esc(d.pack)+(d.src?'<br>読み取り：'+esc(d.src):(d.rem?'<br><b style="color:var(--bad)">読み取りなし</b>':''))+'</td></tr>'; }
  document.getElementById("tb").innerHTML=h||'<tr><td colspan="9" class="empty">条件に合う行はありません</td></tr>';
  document.getElementById("ngSum").textContent="NG・受注にないスキャン（"+(D.ngs+D.unplanned)+"件）"+(D.ng.length<D.ngs+D.unplanned?"　※先頭"+D.ng.length+"件を表示":"");
  document.getElementById("ngTb").innerHTML=D.ng.map(s=>'<tr><td>'+esc(s.k)+'</td><td>'+esc(s.ty)+'</td><td>'+esc(s.t)+'</td><td>'+esc(s.sb)+'</td><td class="mono">'+esc(s.p)+'</td><td class="mono">'+esc(s.doc)+'</td><td style="white-space:normal">'+esc(s.why)+'</td><td>'+esc(s.f)+'</td></tr>').join("")||'<tr><td colspan="8" class="empty">ありません</td></tr>';
}
function toggleRow(tr){ const k=tr.dataset.k; if(OPEN.has(k)) OPEN.delete(k); else OPEN.add(k); try{localStorage.setItem("snapOpen",JSON.stringify([...OPEN].slice(-200)))}catch(x){} draw(); }
document.addEventListener("keydown",e=>{ const tr=e.target.closest&&e.target.closest("tr.grp"); if(tr&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); toggleRow(tr); } });
document.addEventListener("click",e=>{const tr=e.target.closest("tr.grp"); if(tr){ toggleRow(tr); return; } const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.st){st=b.dataset.st; try{localStorage.setItem("snapSt",st)}catch(x){}} if(b.dataset.mk){mk=b.dataset.mk; try{localStorage.setItem("snapMk",mk)}catch(x){}} draw();});

/* ===== データの読み込み（2026-11-17b）=====
   照合PCが Googleドライブに上書きする「出荷漏れ照合_最新.html」から、Apps Script が照合データだけを返す。
   送り先URL・合言葉は表紙の ⚙ で、この端末の中だけに保存（localStorage 'shukkaMoreViewCfg' の gas・key）。
   前回のデータは この端末に残し、Wi-Fi がないときはそれを見せる（古さは帯で知らせる＝あんどん）。 */
const CFG=(()=>{try{return JSON.parse(localStorage.getItem("shukkaMoreViewCfg")||"null")||{}}catch(e){return{}}})();
const LAST="shukkaMoreViewLast";
function net(h){document.getElementById("net").innerHTML=h;}
function hm(t){const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
try{const c=JSON.parse(localStorage.getItem(LAST)||"null"); if(c&&c.D){D=c.D; net('前回の取得 <b>'+hm(c.got)+'</b>（読み込み中…）');}}catch(e){}
async function load(){
  if(!/^https:\/\/script\.google\.com\//.test(CFG.gas||"")||!CFG.key){
    net('<span class="x">⚙ 接続の設定がまだです。表紙の右上 ⚙ で「出荷漏れ照合（閲覧用）」の URL と合言葉を入れてください。</span>　<a class="bk" href="../">表紙へ</a>');
    if(!D) document.getElementById("tb").innerHTML='<tr><td colspan="9" class="empty">データがありません</td></tr>';
    return;
  }
  try{
    const r=await fetch(CFG.gas+"?key="+encodeURIComponent(CFG.key)+(DAY?"&day="+DAY:"")+"&t="+Date.now(),{cache:"no-store"});
    const j=await r.json();
    if(DAY){ if(!j.ok) throw new Error(j.err==="none"?DAY+" の記録はありません":(j.err||"読み込めません")); D=j.D; net('過去の状況を取得 <b>'+esc(DAY)+'</b>'); draw(); return; }
    try{ const r2=await fetch(CFG.gas+"?key="+encodeURIComponent(CFG.key)+"&list=1&t="+Date.now(),{cache:"no-store"}); const t2=await r2.text(); let j2=null; try{j2=JSON.parse(t2)}catch(x){}
      if(j2&&j2.ok&&Array.isArray(j2.days)){ DAYS=j2.days; drawDays(); if(!DAYS.length) dayMsg("📅 過去の記録：まだありません（Apps Script が「出荷漏れ照合結果\\日別」を見つけられません）"); }
      else if(j2&&j2.ok&&j2.D) dayMsg("📅 過去の記録：Apps Script が古い版です（Code.gs 2026-11-18c を貼り、新バージョンでデプロイ）");
      else dayMsg("📅 過去の記録：読めません（"+esc(j2?(j2.err||"?"):t2.slice(0,120))+"）"); }catch(x){ dayMsg("📅 過去の記録：読めません（"+esc(x.message)+"）"); }
    if(!j.ok) throw new Error(j.err==="key"?"合言葉がちがいます":j.err==="format"?"閲覧用ファイルの形が読めません":(j.err||"読み込めません"));
    D=j.D; const got=Date.now();
    try{localStorage.setItem(LAST,JSON.stringify({got,D}))}catch(e){}
    net('最新を取得 <b>'+hm(got)+'</b>');
    draw();
  }catch(e){
    net('<span class="x">⚠ 読み込めませんでした（'+esc(e.message||"Wi-Fiなし")+'）</span>'+(D?'　前回のデータを表示しています':''));
    draw();
  }
}
draw(); load(); setInterval(load,60000); setInterval(draw,30000);
</script></body></html>
