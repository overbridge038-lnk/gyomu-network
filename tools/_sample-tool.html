<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプルツール</title>
<style>
  body{margin:0;font-family:"Noto Sans JP",Meiryo,sans-serif;background:#f3f5f8}
  .bar{display:flex;align-items:center;gap:12px;background:#1f3a5f;color:#fff;padding:10px 14px}
  .bar a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:6px 12px;border-radius:8px}
  .bar .ver{margin-left:auto;font-size:13px;opacity:.85}
  main{padding:20px}
</style>
</head>
<body>
<!-- 各ツールの上にこの1行を入れると、表紙へ戻れて版も一目で分かります -->
<div class="bar">
  <a href="../index.html">← 表紙へ</a>
  <strong>サンプルツール</strong>
  <span class="ver">ver 2026-11-15</span>
</div>
<main>ここに各ツールの中身が入ります。</main>
</body>
</html>
