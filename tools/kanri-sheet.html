<style>
/* まとめ版：上のタブで客先を選ぶと、その客先のツールが下に出ます（中身は客先ごとのツールと同じ） */
:root{ --bg:#eef1f5; --line:#c8ced6; --text:#1d2329; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo UI","Meiryo",sans-serif}
#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#28303c;color:#fff;flex-wrap:wrap}
#bar h1{margin:0 8px 0 0;font-size:18px;white-space:nowrap}
.tab{display:flex;align-items:center;gap:8px;border:3px solid transparent;border-radius:10px;background:#3b4552;color:#fff;padding:6px 14px 6px 8px;cursor:pointer;font-family:inherit;min-height:52px}
.tab img{width:38px;height:38px}
.tab b{display:block;font-size:18px;text-align:left}
.tab small{display:block;font-size:11px;opacity:.85;text-align:left}
.tab:hover{background:#4a5563}
.tab.sel{background:var(--c);border-color:#fff}
#hint{font-size:12px;opacity:.85;margin-left:auto}
#frames{position:relative;height:calc(100% - 68px)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.sel{display:block}
#first{padding:40px 16px;text-align:center;font-size:20px;color:#555}
@media (max-width:700px){ #hint{display:none} .tab{padding:4px 8px} .tab b{font-size:15px} #frames{height:calc(100% - 128px)} }
</style>
</head>

<script>
"use strict";
/* 客先ごとのツールを、選ばれたときに1回だけ作る（作った画面は残すので、切り替えても入力は消えない） */
var made={};
function b64utf8(b){ var bin=atob(b), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder("utf-8").decode(u); }
function show(k){
  var fr=document.getElementById("frames"), f1=document.getElementById("first"); if(f1) f1.remove();
  if(!made[k]){ var f=document.createElement("iframe"); f.title=k; f.srcdoc=b64utf8(document.getElementById("src_"+k).textContent); fr.appendChild(f); made[k]=f; }
  Object.keys(made).forEach(function(x){ made[x].classList.toggle("sel",x===k); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){ t.classList.toggle("sel",t.getAttribute("data-k")===k); });
  var name=document.querySelector('.tab[data-k="'+k+'"] b').textContent; document.title="管理シート作成ツール（"+name+"）";
  try{ localStorage.setItem("kanriTab",k); }catch(e){}
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){ t.onclick=function(){ show(t.getAttribute("data-k")); }; });
var last=null; try{ last=localStorage.getItem("kanriTab"); }catch(e){}
if(last&&document.getElementById("src_"+last)) show(last);
</script>
