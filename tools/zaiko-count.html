<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>在庫カウント</title>
<style>
/* 色のルール：灰＝まだ数えていない、緑＝数えた、黄＝基準より少ない、赤＝送信していない／エラー、青＝入力 */
:root{ --ok:#1e7b34; --okbg:#c6efce; --warn:#7a5c00; --warnbg:#ffeb9c; --ng:#9c0006; --ngbg:#ffc7ce;
  --inp:#1f4e78; --inpbg:#dde9f7; --gray:#666; --graybg:#eeeeee; --line:#c8ced6; --bg:#f4f6f9; --text:#1d2329; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo UI","Meiryo","Noto Sans JP",sans-serif;font-size:17px}
header{background:#1f4e78;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
header h1{margin:0;font-size:20px;flex:1 1 auto}
header .ver{font-size:12px;opacity:.85}
header select{font-size:16px;padding:4px;border-radius:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.bar label{font-size:14px;color:var(--gray)}
.bar input[type=date],.bar input[type=text]{font-size:17px;padding:6px 8px;border:2px solid var(--inp);background:var(--inpbg);border-radius:6px}
#placeBtn{font-size:19px;font-weight:bold;padding:8px 14px;border:3px solid var(--inp);background:var(--inpbg);color:var(--inp);border-radius:10px;cursor:pointer}
.tabs{display:flex;gap:6px;padding:8px 12px 0}
.tab{flex:1;font-size:19px;font-weight:bold;padding:12px 6px;border:0;border-radius:10px 10px 0 0;background:#c9d3df;color:#334;cursor:pointer}
.tab.sel{background:#1f4e78;color:#fff}
.tab small{display:block;font-size:13px;font-weight:normal}
#scan{display:flex;gap:6px;padding:8px 12px;background:#1f4e78}
#scan input{flex:1;font-size:20px;padding:10px;border-radius:8px;border:0}
#scan button{font-size:16px;padding:0 14px;border-radius:8px;border:0}
#list{padding:6px 12px 130px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:#fff;border:2px solid var(--line);border-left:12px solid #bbb;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;min-height:70px}
.it .sb{font-size:26px;font-weight:bold;letter-spacing:1px}
.it .vs{font-size:24px;font-weight:bold;color:var(--inp);margin-left:18px;letter-spacing:0}
.it .sub{font-size:14px;color:var(--gray)}
.it .tot{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:30px;font-weight:bold;min-width:96px}
.it .tot small{display:block;font-size:12px;font-weight:normal;color:var(--gray)}
.it.done{border-left-color:var(--ok);background:#f3fbf5}
.it.low{border-left-color:#e0a800;background:#fffbe8}
.it.hit{outline:4px solid #e67e00}
.lamps{display:flex;gap:6px;padding:0 12px 4px}
.lamp{flex:1;text-align:center;border-radius:8px;padding:6px 2px;font-size:13px;cursor:pointer;border:2px solid transparent}
.lamp b{display:block;font-size:22px}
.lamp.sel{border-color:#1d2329}
.l0{background:var(--graybg)} .l1{background:var(--okbg)} .l2{background:var(--warnbg)}
#foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sendSt{flex:1 1 200px;font-size:15px;font-weight:bold;padding:8px;border-radius:8px}
#sendSt.ng{background:var(--ngbg);color:var(--ng)} #sendSt.ok{background:var(--okbg);color:var(--ok)} #sendSt.wait{background:var(--warnbg);color:var(--warn)}
#sendBtn{font-size:21px;font-weight:bold;padding:12px 22px;border:0;border-radius:10px;background:var(--ok);color:#fff;cursor:pointer}
.sbtn{font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
/* 入力画面 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
/* 入力画面を開いたままでも、後ろの一覧の品番をタップすると切り替わる（毎回一覧に戻らなくてよい） */
#mIn{background:transparent;pointer-events:none}
#mIn .sheet{pointer-events:auto;box-shadow:0 -4px 24px rgba(0,0,0,.35)}
.it.cur{outline:5px solid #1f4e78;outline-offset:-2px;background:#dde9f7!important}
@media (min-width:900px){
  #mIn{justify-content:flex-end;align-items:stretch}
  #mIn .sheet{max-width:48%;max-height:100vh;border-radius:16px 0 0 16px;box-shadow:-4px 0 24px rgba(0,0,0,.3)}
  body.inOpen #list,body.inOpen .lamps,body.inOpen #scan,body.inOpen .tabs{margin-right:48%}
  body.inOpen #foot{right:48%}
}
@media (max-width:899px){ body.inOpen #list{padding-bottom:75vh} }
.modal.hide{display:none}
.dday{font-size:15px;margin:0 3px;padding:4px 8px;border:2px solid var(--inp);background:#fff;color:var(--inp);border-radius:14px;cursor:pointer}
.dday.sel{background:var(--inp);color:#fff}
.sheet{background:#fff;width:100%;max-width:720px;max-height:96vh;overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px 16px}
.mh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mh .sb{font-size:34px;font-weight:bold}
.mh .sub{font-size:14px;color:var(--gray)}
.ents{margin:8px 0;border:1px solid var(--line);border-radius:8px}
.ent{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #eee;font-size:18px}
.ent:last-child{border-bottom:0}
.ent .lc{flex:1}
.ent .q{font-weight:bold;font-size:20px}
.ent button{font-size:15px;padding:6px 10px;border:1px solid #c66;background:#fff0f0;color:var(--ng);border-radius:6px}
.sum{font-size:22px;text-align:right;padding:4px 4px 8px}
.sum b{font-size:34px;color:var(--ok)}
.mvs{float:left;font-size:30px;font-weight:bold;color:var(--inp)}
.sum.fl{animation:fl .6s} @keyframes fl{0%{background:#c6efce}100%{background:transparent}}
.places{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.pl{font-size:16px;padding:8px 12px;border:2px solid var(--inp);background:#fff;color:var(--inp);border-radius:20px;cursor:pointer}
.pl.sel{background:var(--inp);color:#fff}
.disp{display:flex;gap:8px;align-items:center}
.disp .num{flex:1;font-size:40px;font-weight:bold;text-align:right;padding:6px 12px;border:3px solid var(--inp);background:var(--inpbg);border-radius:10px;min-height:66px}
.unit button{font-size:16px;padding:10px 12px;border:2px solid var(--inp);background:#fff;color:var(--inp);border-radius:8px}
.unit button.sel{background:var(--inp);color:#fff}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.keys button{font-size:28px;font-weight:bold;padding:14px 0;border:1px solid #aab;border-radius:10px;background:#f7f9fc;cursor:pointer}
.keys .add{background:var(--ok);color:#fff;font-size:30px;grid-row:span 2}
.keys .zero{background:#eef;font-size:17px}
.mfoot{display:flex;gap:8px;margin-top:10px}
.mfoot button{flex:1;font-size:19px;padding:12px;border-radius:10px;border:0;cursor:pointer}
.bClose{background:#1f4e78;color:#fff;font-size:22px!important;font-weight:bold}
.bNext{background:#e67e00;color:#fff}
.msg{font-size:16px;padding:6px 10px;border-radius:6px;margin:6px 0}
.msg.ng{background:var(--ngbg);color:var(--ng);font-weight:bold}
.box{background:#fff;border-radius:14px;padding:16px;width:94%;max-width:520px;margin:auto;align-self:center}
.box h3{margin:0 0 10px}
.box input[type=text]{width:100%;font-size:18px;padding:8px;border:2px solid var(--inp);border-radius:6px;background:var(--inpbg)}
.box .row{display:flex;gap:8px;margin-top:12px}
.box .row button{flex:1;font-size:18px;padding:12px;border-radius:10px;border:0;cursor:pointer}
.std{font-size:13px;color:var(--gray);padding:4px 12px}
.hide{display:none}
.dday{font-size:15px;margin:0 3px;padding:4px 8px;border:2px solid var(--inp);background:#fff;color:var(--inp);border-radius:14px;cursor:pointer}
.dday.sel{background:var(--inp);color:#fff}
</style>
</head>

/* ---------- 状態（タブレットの中に保存） ---------- */
var KEY = "zaikoCount_"+DATA.customer+"_"+(DATA.period||"");
var CKEY = "zaikoCountCfg";
var st = { date:"", tablet:"", entries:{}, ops:[], syncAt:"", sentHash:"", sentAt:"" };
var cfg = { lang:"ja", gas:DATA.gas||"", places:null, place:"", unit:"box" };
/* 日付ごとに分けて保存：{ tablet, days:{ "2026-11-04":{ entries, sentHash, sentAt }, … } }
   カレンダーの日付を変えると、その日のデータに切り替わる（削除を押さない限り残る） */
var ALL = { tablet:"", days:{} };
function loadDay(d){ var x=ALL.days[d]||{}; st.date=d; st.entries=x.entries||{}; st.ops=x.ops||[]; st.syncAt=x.syncAt||""; st.sentHash=x.sentHash||""; st.sentAt=x.sentAt||"";
  // 前の版の入力（IDがない）にIDを付けて、共有に送る
  Object.keys(st.entries).forEach(function(k){ (st.entries[k]||[]).forEach(function(e){ if(!e.id){ e.id=newId(); e.by=e.by||st.tablet||""; st.ops.push({ op:"add", e:opE(k,e) }); } }); }); }
function newId(){ return (st.tablet||"T").replace(/[^\w\u3040-\u9fff]/g,"").slice(0,8)+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }
function opE(k,e){ var p=k.split("|"), sh=DATA.sheets.filter(function(x){ return x.key===p[0]; })[0]; return { id:e.id, k:k, seban:p.slice(1).join("|"), sheet:sh?sh.name:p[0], box:e.box, pcs:e.pcs==null?null:e.pcs, by:e.by||st.tablet||"", t:e.t||Date.now() }; }
function load(){ try{ var a=JSON.parse(localStorage.getItem(KEY)||"null");
    if(a&&a.days) ALL=a;
    else if(a&&a.entries){ ALL={ tablet:a.tablet||"", days:{} }; if(a.date) ALL.days[a.date]={ entries:a.entries, sentHash:a.sentHash, sentAt:a.sentAt }; } // 前の版のデータを引き継ぐ
  }catch(e){}
  st.tablet=ALL.tablet||"";
  try{ var b=JSON.parse(localStorage.getItem(CKEY)||"null"); if(b){ cfg=Object.assign(cfg,b); if(!cfg.gas&&DATA.gas) cfg.gas=DATA.gas; } }catch(e){} }
function save(){
  ALL.tablet=st.tablet;
  if(Object.keys(st.entries).length||st.ops.length) ALL.days[st.date]={ entries:st.entries, ops:st.ops, syncAt:st.syncAt, sentHash:st.sentHash, sentAt:st.sentAt };
  else delete ALL.days[st.date];
  try{ localStorage.setItem(KEY,JSON.stringify(ALL)); }catch(e){} }
function saveCfg(){ try{ localStorage.setItem(CKEY,JSON.stringify(cfg)); }catch(e){} }
load();
function today(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
loadDay(today()); // 開いたときは今日（前の日のデータはカレンダーで日付を選べば出る）
// 場所の一覧：シートのロケーション＋よく使う場所（現場で直せる）
if(!cfg.places){ cfg.places=["パレット置場","ストア","塗装後","ライン","出荷場","その他"]; }

/* ---------- 小さな道具 ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function L(k){ return (T[cfg.lang]||T.ja)[k]||T.ja[k]||k; }
function norm(s){ return String(s==null?"":s).replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/[\s　]/g,"").toUpperCase(); }
function mdOf(d){ var m=/^\d{4}-(\d{2})-(\d{2})$/.exec(d||""); return m?(+m[1])+"/"+(+m[2]):d; }
function r1(n){ return Math.round(n*10)/10; }
function key(sh,it){ return sh.key+"|"+it.seban; }
function totalOf(k){ var e=st.entries[k]; if(!e||!e.length) return null; return r1(e.reduce(function(a,x){ return a+x.box; },0)); }
var cur = 0, filt = "all", hitKey = null;

/* ---------- 画面 ---------- */
function paintStatic(){
  document.documentElement.lang=cfg.lang;
  $("ttl").textContent="📦 "+DATA.customer+" 在庫カウント";
  $("ver").textContent=VER+(DATA.period?"　"+L("period")+" "+DATA.period:"");
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(e){ e.textContent=L(e.getAttribute("data-t")); });
  $("lang").value=cfg.lang; $("dt").value=st.date; $("tab").value=st.tablet;
  // 入力のある日（押すとその日に切り替わる）
  var ds=Object.keys(ALL.days).filter(function(d){ return d!==st.date||Object.keys(st.entries).length; }); if(Object.keys(st.entries).length&&ds.indexOf(st.date)<0) ds.push(st.date); ds.sort();
  $("days").innerHTML=ds.length?L("hasData")+"："+ds.map(function(d){ return '<button class="dday'+(d===st.date?' sel':'')+'" data-d="'+d+'">'+mdOf(d)+'</button>'; }).join(""):"";
  Array.prototype.forEach.call($("days").querySelectorAll("button"),function(b){ b.onclick=function(){ save(); loadDay(b.getAttribute("data-d")); render(); }; });
  $("q").placeholder=L("search"); $("stdTxt").textContent=L("std1");
  $("menuBtn").title=L("menu");
  $("clrBtn").textContent="🗑 "+L("clrLbl");
}
function render(){
  paintStatic();
  // タブ
  $("tabs").innerHTML=DATA.sheets.map(function(sh,i){
    var n=sh.items.filter(function(it){ return totalOf(key(sh,it))!=null; }).length;
    return '<button class="tab'+(i===cur?' sel':'')+'" data-i="'+i+'">'+esc(sh.name)+'<small>'+n+' / '+sh.items.length+'</small></button>'; }).join("");
  Array.prototype.forEach.call($("tabs").children,function(b){ b.onclick=function(){ cur=+b.getAttribute("data-i"); filt="all"; render(); }; });
  var sh=DATA.sheets[cur], c=[0,0,0];
  sh.items.forEach(function(it){ var t=totalOf(key(sh,it)); if(t==null) c[0]++; else { c[1]++; if(it.std!=null&&t<it.std) c[2]++; } });
  $("lamps").innerHTML=[["notyet","l0",c[0]],["done","l1",c[1]],["low","l2",c[2]],["all","",sh.items.length]].map(function(a){
    return '<div class="lamp '+a[1]+(filt===a[0]?' sel':'')+'" data-f="'+a[0]+'"><b>'+a[2]+'</b>'+L(a[0])+'</div>'; }).join("");
  Array.prototype.forEach.call($("lamps").children,function(d){ d.onclick=function(){ filt=d.getAttribute("data-f"); render(); }; });
  // 一覧
  var q=norm($("q").value);
  $("list").innerHTML=sh.items.map(function(it,i){
    var k=key(sh,it), t=totalOf(k), cls="it";
    if(t!=null){ cls+=(it.std!=null&&t<it.std)?" low":" done"; }
    var show = filt==="all" || (filt==="notyet"&&t==null) || (filt==="done"&&t!=null) || (filt==="low"&&t!=null&&it.std!=null&&t<it.std);
    if(q&&norm(it.seban).indexOf(q)<0&&q.indexOf(norm(it.seban))<0) show=false;
    if(!show) return "";
    var vs=(st.entries[k]||[]).map(function(e){ return e.box; }).join(", ");
    return '<div class="'+cls+(hitKey===k?' hit':'')+(M&&M.si===cur&&M.ii===i?' cur':'')+'" data-i="'+i+'"><div class="sb">'+esc(it.seban)+(vs?'<span class="vs">'+esc(vs)+'</span>':'')+'</div>'+
      '<div class="tot">'+(t==null?'<span style="color:#aaa">－</span>':t)+'<small>'+(t==null?L("notyet"):L("total")+'（'+L("box")+'）')+'</small></div>'+
      '<div class="sub">'+esc(it.loc||"")+(it.std!=null?'　'+L("std")+' '+it.std+L("box"):'')+(it.perDay!=null?'　'+L("perday")+' '+it.perDay:'')+'</div></div>';
  }).join("");
  Array.prototype.forEach.call($("list").querySelectorAll(".it"),function(d){ d.onclick=function(){ openIn(cur,+d.getAttribute("data-i")); }; });
  paintSend();
}
function hashNow(){ return JSON.stringify([st.date,st.tablet,st.entries]); }
function paintSend(){
  var s=$("sendSt"); $("sendBtn").textContent=L("send");
  if(SY.busy){ s.className="wait"; s.textContent=L("sending"); return; }
  if(st.ops.length){ s.className="ng"; s.textContent="⚠ "+L("pending").replace("{n}",st.ops.length)+(SY.err?"（"+SY.err+"）":""); return; }
  if(st.syncAt){ s.className="ok"; s.textContent="✓ "+L("shared")+" "+st.syncAt; return; }
  s.className="wait"; s.textContent=L("notShared");
}

/* ---------- 入力画面（品番ごとに場所別の数を山積み） ---------- */
var M = null; // { si, ii, num }
function openIn(si,ii){
  var sh=DATA.sheets[si], it=sh.items[ii];
  if(M&&M.num!==""&&(M.si!==si||M.ii!==ii)){ err(L("notOk")); return; } // OKを押していない数があるときは切り替えない（入れ忘れ防止）
  M={ si:si, ii:ii, num:"", unit:"box" };
  document.body.classList.add("inOpen");
  $("mSb").textContent=it.seban;
  $("mSub").textContent=sh.name+"　"+(it.loc||"")+(it.std!=null?"　"+L("std")+" "+it.std+L("box"):"")+(it.iri?"　"+it.iri+L("pcs")+"/"+L("box"):"");
  $("mClose").textContent="◀ "+L("back");
  paintIn(); $("mIn").classList.remove("hide"); render();
  var el=document.querySelector('#list .it[data-i="'+ii+'"]'); if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest"});
}
function paintIn(){
  var sh=DATA.sheets[M.si], it=sh.items[M.ii], k=key(sh,it), es=st.entries[k]||[];
  $("mEnts").innerHTML=es.length?es.map(function(e,j){ return '<div class="ent"><span class="lc">'+(j+1)+L("nth")+'</span><span class="q">'+e.box+' '+L("box")+(e.pcs!=null?' <small>('+e.pcs+L("pcs")+')</small>':'')+'</span><button data-j="'+j+'">'+L("del")+'</button></div>'; }).join("")
    :'<div class="ent" style="color:#999">'+L("noEntry")+'</div>';
  Array.prototype.forEach.call($("mEnts").querySelectorAll("button"),function(b){ b.onclick=function(){ var g=es.splice(+b.getAttribute("data-j"),1)[0]; if(g&&g.id) st.ops.push({ op:"del", id:g.id }); if(!es.length) delete st.entries[k]; save(); paintIn(); render(); syncSoon(); }; });
  var t=totalOf(k); $("mTot").textContent=t==null?"0":t;
  $("mVs").textContent=es.length?es.map(function(e){ return e.box; }).join(", "):"";
  $("mNum").textContent=M.num||"0";
  $("mUnit").innerHTML=it.iri?('<button data-u="box" class="'+(M.unit==="box"?'sel':'')+'">'+L("box")+'</button> <button data-u="pcs" class="'+(M.unit==="pcs"?'sel':'')+'">'+L("pcs")+'</button>'):'<span style="font-size:20px">'+L("box")+'</span>';
  Array.prototype.forEach.call($("mUnit").querySelectorAll("button"),function(b){ b.onclick=function(){ M.unit=b.getAttribute("data-u"); paintIn(); }; });
  var ks=["7","8","9","←","4","5","6","ADD","1","2","3","0","C","."];
  $("mKeys").innerHTML=ks.map(function(x){
    if(x==="ADD") return '<button class="add" data-k="ADD">'+L("add")+'</button>';
    return '<button data-k="'+x+'">'+x+'</button>'; }).join("");
  Array.prototype.forEach.call($("mKeys").querySelectorAll("button"),function(b){ b.onclick=function(){ key1(b.getAttribute("data-k")); }; });
  $("mErr").classList.add("hide");
}
function placeList(it){ var a=[]; if(it&&it.loc) a.push(it.loc); cfg.places.forEach(function(p){ if(a.indexOf(p)<0) a.push(p); }); if(cfg.place&&a.indexOf(cfg.place)<0) a.unshift(cfg.place); return a; }
function flash(){ var x=document.querySelector("#mIn .sum"); x.classList.remove("fl"); void x.offsetWidth; x.classList.add("fl"); } // 足したことを目で分かるように
function err(t){ var e=$("mErr"); e.textContent=t; e.classList.remove("hide"); }
function key1(k){
  var sh=DATA.sheets[M.si], it=sh.items[M.ii], kk=key(sh,it);
  if(k==="C"){ M.num=""; }
  else if(k==="←"){ M.num=M.num.slice(0,-1); }
  else if(k==="."){ if(M.num.indexOf(".")<0) M.num=(M.num||"0")+"."; }
  else if(k==="ADD"){
    if(M.num===""){ return; } // 何も入れずに押したときは何もしない（0は「0」を入れて足す）
    var v=parseFloat(M.num); if(!(v>=0)){ return; }
    if(v>999||(M.unit==="pcs"&&v>99999)){ err(L("tooBig")); return; } // ポカヨケ：桁の打ち間違い
    var e={ loc:"", t:Date.now(), id:newId(), by:st.tablet||"" };
    if(M.unit==="pcs"&&it.iri){ e.pcs=v; e.box=r1(v/it.iri); } else e.box=r1(v);
    (st.entries[kk]=st.entries[kk]||[]).push(e); st.ops.push({ op:"add", e:opE(kk,e) }); M.num=""; save(); render(); paintIn(); flash(); syncSoon(); return; // 画面は閉じない（パレットを続けて数えられる）
  }
  else { if(M.num.length<6) M.num=(M.num==="0"?"":M.num)+k; }
  $("mNum").textContent=M.num||"0";
}
$("mClose").onclick=function(){ $("mIn").classList.add("hide"); document.body.classList.remove("inOpen"); M=null; render(); };

/* ---------- メッセージ箱（ブラウザのalertは使わない） ---------- */
function box(html,btns){
  var b=$("boxIn"); b.innerHTML=html+'<div class="row">'+btns.map(function(x,i){ return '<button data-i="'+i+'" style="background:'+(x.c||"#1f4e78")+';color:#fff">'+esc(x.t)+'</button>'; }).join("")+'</div>';
  $("mBox").classList.remove("hide");
  Array.prototype.forEach.call(b.querySelectorAll(".row button[data-i]"),function(x){ x.onclick=function(){ var f=btns[+x.getAttribute("data-i")].f; if(!f||f()!==false) $("mBox").classList.add("hide"); }; });
}
function say(t,ng){ box('<div class="msg '+(ng?'ng':'')+'" style="font-size:18px">'+esc(t)+'</div>',[{t:L("ok")}]); }
function askPlace(done){
  box('<h3>'+L("placeName")+'</h3><input type="text" id="npl">',[{t:L("no"),c:"#888"},{t:L("save"),c:"#1e7b34",f:function(){ var v=$("npl").value.trim(); if(!v) return false; if(cfg.places.indexOf(v)<0) cfg.places.push(v); cfg.place=v; saveCfg(); paintStatic(); if(done) done(v); }}]);
  setTimeout(function(){ var e=$("npl"); if(e) e.focus(); },50);
}

/* ---------- 検索・スキャン（ハンディスキャナーで かんばんを読むと、その背番に飛ぶ） ---------- */
$("q").oninput=function(){ hitKey=null; render(); };
$("q").onkeydown=function(e){
  if(e.key!=="Enter") return;
  var q=norm($("q").value); if(!q) return;
  for(var si=0;si<DATA.sheets.length;si++){ var sh=DATA.sheets[si];
    for(var ii=0;ii<sh.items.length;ii++){ var s=norm(sh.items[ii].seban); if(s===q||(q.length>s.length&&q.indexOf(s)>=0)){ cur=si; $("q").value=""; hitKey=key(sh,sh.items[ii]); render(); openIn(si,ii); return; } } }
  say(L("notFound")+$("q").value,true); $("q").select();
};
$("qClr").onclick=function(){ $("q").value=""; hitKey=null; render(); $("q").focus(); };

/* ---------- 日付・タブレット名・言葉 ---------- */
// 一覧は作り直さない（入力直後のタップが効かなくなるのを防ぐ）
$("dt").onchange=function(){ save(); loadDay($("dt").value||today()); render(); sync(false); };
$("tab").onchange=function(){ st.tablet=$("tab").value.trim(); save(); paintSend(); };
$("lang").onchange=function(){ cfg.lang=$("lang").value; saveCfg(); render(); if(M) paintIn(); };

/* ---------- 共有：入力のたびに自動で送り、ほかの端末の入力も読み込む ----------
   ・送るのは「足した／取り消した」だけ（同じものを2回送っても二重にならない）
   ・Wi-Fiがないときは端末にためておき、つながったら自動で送る */
var SY={ busy:false, timer:null, err:"" };
function gasUrl(q){ return cfg.gas+(cfg.gas.indexOf("?")<0?"?":"&")+q+"&_="+Date.now(); }
function itemList(){ return DATA.sheets.reduce(function(a,sh){ sh.items.forEach(function(it){ a.push({ sheet:sh.name, seban:it.seban, std:it.std }); }); return a; },[]); }
function syncSoon(){ clearTimeout(SY.timer); SY.timer=setTimeout(function(){ sync(false); },1200); paintSend(); }
function entriesHash(){ return JSON.stringify(st.entries); }
function sync(manual){
  if(SY.busy||!cfg.gas){ paintSend(); return Promise.resolve(false); }
  if(navigator.onLine===false){ SY.err=""; paintSend(); return Promise.resolve(false); }
  SY.busy=true; SY.err=""; paintSend();
  var date=st.date, sending=st.ops.slice();
  var post=sending.length?fetch(cfg.gas,{ method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({ kind:"zaikoSync", customer:DATA.customer, period:DATA.period, date:date, tablet:st.tablet||"", ops:sending, items:itemList(), ver:VER }) }):Promise.resolve();
  return post.then(function(){ return fetch(gasUrl("action=state&customer="+encodeURIComponent(DATA.customer)+"&date="+encodeURIComponent(date))); })
    .then(function(r){ return r.json(); })
    .then(function(j){
      SY.busy=false;
      if(!j||!j.ok||!j.rows) throw new Error((j&&j.err)||"受け口が古い版です（Apps Scriptを更新してください）");
      if(st.date!==date){ paintSend(); return true; }
      var live={}, del={}; j.rows.forEach(function(r){ live[r.id]=r; }); (j.deleted||[]).forEach(function(id){ del[id]=1; });
      // 届いたか確かめる：届いていない変更は残して、次に送り直す
      var left=sending.filter(function(op){ return op.op==="add"?!(live[op.e.id]||del[op.e.id]):!!live[op.id]; });
      st.ops=left.concat(st.ops.slice(sending.length));
      // 共有の入力 ＋ まだ届いていない自分の変更 で一覧を作り直す
      var before=entriesHash(), ent={};
      j.rows.forEach(function(r){ (ent[r.k]=ent[r.k]||[]).push({ id:r.id, box:r.box, pcs:r.pcs==null?undefined:r.pcs, by:r.by, t:r.t, loc:"" }); });
      st.ops.forEach(function(op){ if(op.op==="add"){ if(!live[op.e.id]) (ent[op.e.k]=ent[op.e.k]||[]).push({ id:op.e.id, box:op.e.box, pcs:op.e.pcs==null?undefined:op.e.pcs, by:op.e.by, t:op.e.t, loc:"" }); }
        else Object.keys(ent).forEach(function(k){ ent[k]=ent[k].filter(function(e){ return e.id!==op.id; }); if(!ent[k].length) delete ent[k]; }); });
      Object.keys(ent).forEach(function(k){ ent[k].sort(function(a,b){ return a.t-b.t; }); });
      st.entries=ent; var d=new Date(); st.syncAt=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); save();
      if(entriesHash()!==before){ render(); if(M) paintIn(); } else paintSend();
      if(st.ops.length&&!manual) syncSoon();
      return !st.ops.length;
    })
    .catch(function(e){ SY.busy=false; SY.err=(navigator.onLine===false)?"":(e&&e.message?e.message:String(e)); paintSend(); return false; });
}
setInterval(function(){ if(!document.hidden) sync(false); },20000); // ほかの端末の入力を読み込む
window.addEventListener("online",function(){ sync(false); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden) sync(false); });

/* ---------- 送信（Wi-Fiのときだけ）→ Apps Script → Googleドライブ ---------- */
function payload(){
  return { kind:"zaikoCount", customer:DATA.customer, period:DATA.period, date:st.date, tablet:st.tablet, sentAt:new Date().toISOString(), ver:VER,
    items: DATA.sheets.reduce(function(a,sh){ sh.items.forEach(function(it){ var k=key(sh,it), t=totalOf(k);
      a.push({ sheet:sh.name, seban:it.seban, loc:it.loc||"", std:it.std, total:t, entries:(st.entries[k]||[]).map(function(e){ return { loc:e.loc, box:e.box, pcs:e.pcs }; }) }); }); return a; },[]) };
}
function doSend(){
  if(!st.tablet){ say(L("noTab"),true); $("tab").focus(); return; }
  if(!cfg.gas){ say(L("noGas"),true); return; }
  if(navigator.onLine===false){ say(L("offline"),true); return; }
  sync(true).then(function(ok){ if(ok) say(L("sendOk")); else say(SY.err?L("sendNg")+SY.err:L("offline"),true); });
  return;
  if(!cfg.gas){ say(L("noGas"),true); return; }
  if(navigator.onLine===false){ say(L("offline"),true); return; }
  var p=payload(), h=hashNow(), btn=$("sendBtn"); btn.disabled=true; btn.textContent=L("sending");
  var s=$("sendSt"); s.className="wait"; s.textContent=L("sending");
  // 送信（Apps Scriptは別のサイトなので no-cors で送り、そのあと受け取れたかを確認する）
  fetch(cfg.gas,{ method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(p) })
    .then(function(){ return fetch(cfg.gas+(cfg.gas.indexOf("?")<0?"?":"&")+"action=check&customer="+encodeURIComponent(p.customer)+"&date="+encodeURIComponent(p.date)+"&tablet="+encodeURIComponent(p.tablet)+"&_="+Date.now()); })
    .then(function(r){ return r.json(); })
    .then(function(j){
      btn.disabled=false;
      if(j&&j.ok&&j.sentAt===p.sentAt){ st.sentHash=h; var d=new Date(); st.sentAt=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); save(); render(); say(L("sendOk")); }
      else { render(); say(L("verifyNg"),true); }
    })
    .catch(function(e){ btn.disabled=false; render(); say((navigator.onLine===false?L("offline"):L("sendNg")+(e&&e.message?e.message:e)),true); });
}
$("sendBtn").onclick=function(){
  var n=0; DATA.sheets.forEach(function(sh){ sh.items.forEach(function(it){ if(totalOf(key(sh,it))==null) n++; }); });
  if(n>0) box('<div class="msg" style="background:var(--warnbg);font-size:18px">'+esc(L("confirmSend").replace("{n}",n))+'</div>',[{t:L("no"),c:"#888"},{t:L("yes"),c:"#1e7b34",f:function(){ setTimeout(doSend,10); }}]);
  else doSend();
};

/* ---------- 設定・その他 ---------- */
function saveBlob(blob,fname){ var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },5000); }
$("menuBtn").onclick=function(){
  box('<h3>'+L("menu")+'</h3><div style="font-size:14px">'+L("gasUrl")+'</div><input type="text" id="cGas" value="'+esc(cfg.gas)+'">'+
    '<div class="row"><button id="cBk" style="background:#555;color:#fff">'+L("backup")+'</button></div>'+
    '<div style="font-size:12px;color:#888;margin-top:8px">'+VER+'</div>',
    [{t:L("close"),c:"#888"},{t:L("save"),c:"#1e7b34",f:function(){ cfg.gas=$("cGas").value.trim(); saveCfg(); render(); }}]);
  $("cBk").onclick=function(){ var p=payload(); saveBlob(new Blob([JSON.stringify(p,null,1)],{type:"application/json"}),"在庫カウント_"+DATA.customer+"_"+p.date+"_"+(p.tablet||"tablet")+".json"); };
};
/* ---------- 削除（確認 → 削除 の二段階。押し間違いで消えないように） ---------- */
$("clrBtn").onclick=function(){
  var n=Object.keys(st.entries).length;
  if(!n){ say(L("noEntry")); return; }
  var warn="<br>"+esc(L("clrAll"));
  box('<div class="msg ng" style="font-size:19px">'+esc(mdOf(st.date)+(cfg.lang==="ja"?"":" — ")+L("confirmClear"))+'<br>（'+n+' '+esc(L("items"))+'）'+warn+'</div>',
    [{t:L("no"),c:"#888"},{t:"🗑 "+L("erase"),c:"#9c0006",f:function(){ Object.keys(st.entries).forEach(function(k){ st.entries[k].forEach(function(e){ if(e.id) st.ops.push({ op:"del", id:e.id }); }); }); st.entries={}; save(); render(); syncSoon(); setTimeout(function(){ say(L("cleared")); },10); }}]);
};
/* ---------- 入力がタブレットに残るかを確かめる（残らないときは赤で知らせる） ---------- */
(function(){ var ok=false; try{ localStorage.setItem("__t","1"); ok=localStorage.getItem("__t")==="1"; localStorage.removeItem("__t"); }catch(e){}
  if(!ok){ var e=$("lsNg"); e.textContent="⚠ "+L("lsNg"); e.classList.remove("hide"); } })();
render(); sync(false); // 開いたら、共有の入力を読み込む
</script>
